<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Hero background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a2332" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.72" cy="0.42" r="0.45">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.18" cy="0.7" r="0.3">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" />
  <rect width="1200" height="720" fill="url(#glow1)" />
  <rect width="1200" height="720" fill="url(#glow2)" />

  <!-- constellation lines -->
  <g stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1" fill="none">
    <line x1="820" y1="120" x2="960" y2="200"/>
    <line x1="960" y1="200" x2="1080" y2="160"/>
    <line x1="1080" y1="160" x2="1140" y2="280"/>
    <line x1="960" y1="200" x2="1020" y2="340"/>
    <line x1="1020" y1="340" x2="1140" y2="280"/>
    <line x1="120" y1="480" x2="240" y2="420"/>
    <line x1="240" y1="420" x2="380" y2="500"/>
    <line x1="380" y1="500" x2="460" y2="400"/>
    <line x1="460" y1="400" x2="560" y2="480"/>
    <line x1="240" y1="420" x2="320" y2="320"/>
    <line x1="600" y1="220" x2="700" y2="280"/>
    <line x1="700" y1="280" x2="780" y2="200"/>
    <line x1="700" y1="280" x2="720" y2="380"/>
  </g>

  <!-- stars / dots -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="820" cy="120" r="2"/>
    <circle cx="960" cy="200" r="2.5"/>
    <circle cx="1080" cy="160" r="2"/>
    <circle cx="1140" cy="280" r="1.5"/>
    <circle cx="1020" cy="340" r="2"/>
    <circle cx="120" cy="480" r="1.5"/>
    <circle cx="240" cy="420" r="2"/>
    <circle cx="380" cy="500" r="2"/>
    <circle cx="460" cy="400" r="1.5"/>
    <circle cx="560" cy="480" r="2"/>
    <circle cx="320" cy="320" r="1.5"/>
    <circle cx="600" cy="220" r="1.5"/>
    <circle cx="700" cy="280" r="2"/>
    <circle cx="780" cy="200" r="1.5"/>
    <circle cx="720" cy="380" r="1.5"/>
  </g>

  <!-- scattered small dots -->
  <g fill="#dbeafe" opacity="0.25">
    <circle cx="150" cy="150" r="1"/>
    <circle cx="420" cy="200" r="1"/>
    <circle cx="680" cy="100" r="1"/>
    <circle cx="900" cy="500" r="1"/>
    <circle cx="1100" cy="580" r="1"/>
    <circle cx="60" cy="320" r="1"/>
    <circle cx="500" cy="600" r="1"/>
    <circle cx="850" cy="640" r="1"/>
  </g>
</svg>
