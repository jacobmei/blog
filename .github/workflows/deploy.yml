name: Deploy Astro to GitHub Pages (User/Org)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-user-org-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://jacobmei.com"
      BASE_PATH: "/"
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
      PUBLIC_TIP_ENS_NAME: "jacobmei.eth"
      PUBLIC_SIGNER_ENS_NAME: "jacobmei.eth"
      PUBLIC_WEB3_CHAIN_ID: "1"
      PUBLIC_WEB3_RPC_URL: "https://ethereum.publicnode.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install trad-zh-search

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Verify dist integrity (死鏈與缺圖硬閘門)
        run: node scripts/verify-dist.mjs

      - name: Pin shortCodes for new posts (自動釘網址)
        run: |
          node scripts/pin-shortcodes.mjs
          if ! git diff --quiet -- src/content/blog; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/blog
            git commit -m "chore(blog): 自動回填新文章 shortCode [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "::warning::shortCode 回填 push 失敗，下次部署會再試"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
